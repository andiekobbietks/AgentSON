name: AgentSON archive conformance

on:
  pull_request:
    paths:
      - "spec/**"
      - "tests/conformance/**"
      - "tests/fixtures/conformance/**"
      - ".github/workflows/conformance.yml"
  push:
    branches:
      - master
      - "feat/**"
      - "docs/**"
    paths:
      - "spec/**"
      - "tests/conformance/**"
      - "tests/fixtures/conformance/**"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-archive:
    name: Canonical v1.2 archive contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install conformance test dependencies
        run: python -m pip install --upgrade pytest jsonschema
      - name: Validate canonical archive contract
        run: python -m pytest -q tests/conformance/test_canonical_archive.py
