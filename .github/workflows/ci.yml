name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run test suite
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify distributions exist
        shell: bash
        run: |
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

      - name: Verify schemas are included in the wheel and source distribution
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert "spec/v1.2.json" in names
              assert "spec/v1.2-entries.json" in names

          source = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(source, "r:gz") as archive:
              names = set(archive.getnames())
              assert any(name.endswith("/spec/v1.2.json") for name in names)
              assert any(name.endswith("/spec/v1.2-entries.json") for name in names)
          PY

      - name: Smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "from importlib.resources import files; assert files('spec').joinpath('v1.2.json').is_file(); assert files('spec').joinpath('v1.2-entries.json').is_file()"
          python -c "from cli.main import main; from tools.distribute import publish; from tools.pii_redactor import PIIRedactor"
          agentson --help
