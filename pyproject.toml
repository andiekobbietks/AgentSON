[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentson"
version = "0.1.0"
description = "Agent + JSON — vendor-neutral session capture format for AI coding agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "andiekobbietks"}
]
keywords = ["ai", "agent", "json", "session", "finetuning", "opencode", "minimax"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "jsonschema>=4.17",
    "openpyxl>=3.1",
    "pylatex>=1.4",
    # rich is required directly by cli/help_system.py (Console, Text, Panel,
    # box) -- declared here because it was previously present only as a
    # transitive dependency of mcp-use, so nothing in the package metadata
    # said the CLI needed it. Dropping mcp-use exposed that.
    "rich>=13.0",
    # mcp-use removed 2026-10-21. It was reachable only from
    # stream/lib/mcp_adapter.py, which packages.find does not ship, and it
    # installed 61 of 75 distributions (78.7 MB) including posthog 7.73.3 and
    # Scarf telemetry. Its own import was also broken: it declares
    # mcp>=1.24.0 with no upper bound, pip resolved mcp 2.3.0, and
    # mcp.shared.context.RequestContext was removed there.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyrefly>=0.1",
]
chatgpt = []  # ChatGPT importer uses only stdlib

[project.urls]
Homepage = "https://github.com/andiekobbietks/AgentSON"
Repository = "https://github.com/andiekobbietks/AgentSON"
Issues = "https://github.com/andiekobbietks/AgentSON/issues"

[project.scripts]
agentson = "cli.main:main"

[tool.setuptools.package-data]
"spec" = ["v1.json"]
"supabase" = ["schema.sql"]
"examples" = ["*.AgentSON"]
"pwa" = ["manifest.json", "sw.js", "*.html", "*.png", "*.ico"]

[tool.setuptools.packages.find]
include = ["readers*", "exporters*", "importers*", "cli*", "agentson_platform*", "agentson_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
